services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: timetable
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
    depends_on: [db]
    ports: ["8000:8000"]
    command: python manage.py runserver 0.0.0.0:8000
volumes:
  pgdata:
